<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="Videx-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videxx - Settings</title>

  <style>
    /* Dynamic Accent Color CSS Variables (Defaults to Blue) */
    :root {
      --accent-deg-1: #74d9f7;
      --accent-deg-2: #38bde9;
      --accent-deg-3: #1597d0;
      --accent-deg-4: #0875ad;
      --accent-btn-1: #65d5ff;
      --accent-btn-2: #20afea;
      --accent-btn-3: #0786cb;
      --accent-btn-4: #079bdc;
      --accent-btn-border: #00699e;
      --logo-shadow-1: #b9efff;
      --logo-shadow-2: #168bd0;
      --header-bg-1: #daf4ff;
      --header-bg-2: #b2e5fc;
      --header-bg-3: #90d7f5;
      --header-bg-4: #b8ebfd;
      --panel-glow: rgba(37, 124, 161, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #17384a;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,0.95) 0 2%, transparent 3%),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.75) 0 2%, transparent 3%),
        linear-gradient(
          180deg,
          var(--accent-deg-1) 0%,
          var(--accent-deg-2) 25%,
          var(--accent-deg-3) 65%,
          var(--accent-deg-4) 100%
        );
      min-height: 100vh;
      padding: 0 15px 40px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% -10%,
          rgba(255,255,255,0.8),
          transparent 45%
        );
      opacity: 0.75;
    }

    .site-header {
      width: 100vw;
      position: relative;
      left: calc(-50vw + 50%);
      background:
        linear-gradient(
          180deg,
          var(--header-bg-1) 0%,
          var(--header-bg-2) 50%,
          var(--header-bg-3) 51%,
          var(--header-bg-4) 100%
        );
      border-bottom: 2px solid #ffffff;
      padding: 15px 20px 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(0, 50, 90, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .nav-buttons-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 850px;
    }

    .nav-btn {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      height: 33px;
      padding: 0 16px;
      border-radius: 6px;
      color: #17384a;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f2f9fc 45%,
          #d2eaf4 50%,
          #e5f4fb 100%
        );
      border: 1px solid #72aabd;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,70,100,0.15),
        0 2px 4px rgba(0,50,80,0.2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #ffffff 45%,
          #e3f3fb 50%,
          #f0f8fd 100%
        );
      border-color: #5193a8;
    }

    .nav-btn.active {
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          var(--accent-btn-1) 0%,
          var(--accent-btn-2) 45%,
          var(--accent-btn-3) 50%,
          var(--accent-btn-4) 100%
        );
      border-color: var(--accent-btn-border);
      text-shadow: 0 -1px 1px rgba(0,50,80,0.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,60,100,0.3),
        0 2px 4px rgba(0,50,80,0.25);
    }

    .videx-logo {
      text-align: center;
      margin: 0;
      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-size: 56px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 0.9;
      color: #ffffff;
      transform: skewX(-7deg);
      text-shadow:
        3px 3px 0 var(--logo-shadow-1),
        6px 6px 0 var(--logo-shadow-2),
        9px 9px 8px rgba(0, 63, 110, 0.35);
      user-select: none;
    }

    #mainApp {
      width: 100%;
      max-width: 850px;
      margin: auto;
      position: relative;
    }

    .settings-layout {
      display: flex;
      gap: 16px;
    }

    /* Sidebar Tabs */
    .settings-sidebar {
      width: 220px;
      flex-shrink: 0;
      background:
        linear-gradient(
          180deg,
          #f8fdff 0%,
          #e9f8fd 7%,
          #c9e9f5 48%,
          #a8d8e9 100%
        );
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 12px;
      box-shadow:
        0 2px 0 rgba(0, 82, 126, 0.7),
        0 8px 18px rgba(0, 50, 90, 0.35),
        inset 0 1px 0 #ffffff,
        inset 0 -2px 5px var(--panel-glow);
      height: fit-content;
    }

    .tab-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #72aabd;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f2f9fc 45%,
          #d2eaf4 50%,
          #e5f4fb 100%
        );
      color: #17384a;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,70,100,0.15),
        0 1px 3px rgba(0,50,80,0.15);
    }

    .tab-btn.active {
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          var(--accent-btn-1) 0%,
          var(--accent-btn-2) 45%,
          var(--accent-btn-3) 50%,
          var(--accent-btn-4) 100%
        );
      border-color: var(--accent-btn-border);
      text-shadow: 0 -1px 1px rgba(0,50,80,0.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,60,100,0.3),
        0 2px 4px rgba(0,50,80,0.25);
    }

    /* Main Settings Panel */
    .settings-content {
      flex: 1;
      background:
        linear-gradient(
          180deg,
          #f8fdff 0%,
          #e9f8fd 7%,
          #c9e9f5 48%,
          #a8d8e9 100%
        );
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 22px;
      box-shadow:
        0 2px 0 rgba(0, 82, 126, 0.7),
        0 8px 18px rgba(0, 50, 90, 0.35),
        inset 0 1px 0 #ffffff,
        inset 0 -2px 5px var(--panel-glow);
    }

    .section-title {
      color: #075b8b;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 1px 0 #ffffff;
      margin-bottom: 15px;
      border-bottom: 1px solid #c1dce6;
      padding-bottom: 8px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      color: #164b65;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 0 #ffffff;
      margin-bottom: 10px;
      display: block;
    }

    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .color-btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #72aabd;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      background: #ffffff;
      color: #17384a;
      box-shadow: 0 2px 4px rgba(0,50,80,0.15);
      transition: transform 0.1s ease;
    }

    .color-btn:hover {
      border-color: #168fd0;
    }

    .color-btn.selected {
      border-color: #004c77;
      outline: 2px solid #0786cb;
    }

    .cookies-notice {
      margin-top: 30px;
      padding-top: 12px;
      border-top: 1px dashed #9bc5d4;
      color: #527786;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      text-shadow: 0 1px 0 #ffffff;
    }

    @media (max-width: 600px) {
      .settings-layout {
        flex-direction: column;
      }
      .settings-sidebar {
        width: 100%;
      }
      body {
        padding: 0 10px 30px;
      }
      .videx-logo {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="videx-logo">Videxx</div>
  <nav class="nav-buttons-container">
    <a href="home.html" class="nav-btn">Home</a>
    <a href="accounts-list.html" class="nav-btn">Accounts</a>
    <a href="settings.html" class="nav-btn active">Settings</a>
  </nav>
</header>

<div id="mainApp">
  <div class="settings-layout">
    
    <!-- Sidebar Tabs -->
    <div class="settings-sidebar">
      <button class="tab-btn active">Customization</button>
    </div>

    <!-- Main Content Panel -->
    <div class="settings-content">
      <div class="section-title">Customization</div>

      <div class="setting-group">
        <label class="setting-label">Accent Colour</label>
        <div class="color-options" id="colorOptions">
          <button class="color-btn" data-color="red" style="background:#ffcccc; color:#8b0000;">Red</button>
          <button class="color-btn" data-color="orange" style="background:#ffe6cc; color:#b35900;">Orange</button>
          <button class="color-btn" data-color="yellow" style="background:#ffffcc; color:#999900;">Yellow</button>
          <button class="color-btn" data-color="green" style="background:#ccffcc; color:#006600;">Green</button>
          <button class="color-btn selected" data-color="blue" style="background:#cce6ff; color:#003366;">Blue (Default)</button>
          <button class="color-btn" data-color="purple" style="background:#e6ccff; color:#4b0082;">Purple</button>
          <button class="color-btn" data-color="pink" style="background:#ffccff; color:#99004d;">Pink</button>
        </div>
      </div>

      <div class="cookies-notice">
        Note: This website uses cookies to save your customization preferences locally in your browser.
      </div>
    </div>

  </div>
</div>

<script>
  // Color themes definitions
  const themes = {
    red: {
      deg1: "#f7b5b5", deg2: "#e96e6e", deg3: "#d03232", deg4: "#ad0808",
      btn1: "#ff8080", btn2: "#f03b3b", btn3: "#cb0707", btn4: "#dc0707", btnBorder: "#9e0000",
      shadow1: "#ffbbbb", shadow2: "#d01616",
      header1: "#ffdfdf", header2: "#fcb2b2", header3: "#f59090", header4: "#fdb8b8",
      glow: "rgba(161, 37, 37, 0.25)"
    },
    orange: {
      deg1: "#f7d2b5", deg2: "#e99a6e", deg3: "#d06332", deg4: "#ad3c08",
      btn1: "#ffb065", btn2: "#ea7e20", btn3: "#cb5607", btn4: "#dc5c07", btnBorder: "#9e3900",
      shadow1: "#ffdec0", shadow2: "#d05516",
      header1: "#ffeedf", header2: "#fccbb2", header3: "#f5b090", header4: "#fdc7b8",
      glow: "rgba(161, 85, 37, 0.25)"
    },
    yellow: {
      deg1: "#f7f1b5", deg2: "#e9dc6e", deg3: "#d0bd32", deg4: "#ad9808",
      btn1: "#ffea65", btn2: "#eac420", btn3: "#cba507", btn4: "#dcb207", btnBorder: "#9e7e00",
      shadow1: "#fff9bb", shadow2: "#d0b016",
      header1: "#fffaef", header2: "#fcefb2", header3: "#f5e390", header4: "#fdeeb8",
      glow: "rgba(161, 138, 37, 0.25)"
    },
    green: {
      deg1: "#b5f7c2", deg2: "#6ee986", deg3: "#32d050", deg4: "#08ad27",
      btn1: "#65ff84", btn2: "#20ea46", btn3: "#07cb2e", btn4: "#07dc31", btnBorder: "#009e1e",
      shadow1: "#bbffc8", shadow2: "#16d039",
      header1: "#dffff3", header2: "#b2fcc1", header3: "#90f5a4", header4: "#b8fdbd",
      glow: "rgba(37, 161, 61, 0.25)"
    },
    blue: {
      deg1: "#74d9f7", deg2: "#38bde9", deg3: "#1597d0", deg4: "#0875ad",
      btn1: "#65d5ff", btn2: "#20afea", btn3: "#0786cb", btn4: "#079bdc", btnBorder: "#00699e",
      shadow1: "#b9efff", shadow2: "#168bd0",
      header1: "#daf4ff", header2: "#b2e5fc", header3: "#90d7f5", header4: "#b8ebfd",
      glow: "rgba(37, 124, 161, 0.25)"
    },
    purple: {
      deg1: "#d9b5f7", deg2: "#bd6ee9", deg3: "#9732d0", deg4: "#7508ad",
      btn1: "#d565ff", btn2: "#af20ea", btn3: "#8607cb", btn4: "#9b07dc", btnBorder: "#69009e",
      shadow1: "#efffb9", shadow2: "#8b16d0",
      header1: "#f4daff", header2: "#e5b2fc", header3: "#d590f5", header4: "#ebb8fd",
      glow: "rgba(124, 37, 161, 0.25)"
    },
    pink: {
      deg1: "#f7b5e0", deg2: "#e96ec0", deg3: "#d0329b", deg4: "#ad0876",
      btn1: "#ff65c9", btn2: "#ea209f", btn3: "#cb0784", btn4: "#dc0793", btnBorder: "#9e005d",
      shadow1: "#ffb9ec", shadow2: "#d0168b",
      header1: "#ffdff3", header2: "#fcb2e5", header3: "#f590d5", header4: "#fdb8eb",
      glow: "rgba(161, 37, 124, 0.25)"
    }
  };

  // Function to apply theme to document
  function applyTheme(colorName) {
    const t = themes[colorName] || themes["blue"];
    const root = document.documentElement;
    root.style.setProperty('--accent-deg-1', t.deg1);
    root.style.setProperty('--accent-deg-2', t.deg2);
    root.style.setProperty('--accent-deg-3', t.deg3);
    root.style.setProperty('--accent-deg-4', t.deg4);
    root.style.setProperty('--accent-btn-1', t.btn1);
    root.style.setProperty('--accent-btn-2', t.btn2);
    root.style.setProperty('--accent-btn-3', t.btn3);
    root.style.setProperty('--accent-btn-4', t.btn4);
    root.style.setProperty('--accent-btn-border', t.btnBorder);
    root.style.setProperty('--logo-shadow-1', t.shadow1);
    root.style.setProperty('--logo-shadow-2', t.shadow2);
    root.style.setProperty('--header-bg-1', t.header1);
    root.style.setProperty('--header-bg-2', t.header2);
    root.style.setProperty('--header-bg-3', t.header3);
    root.style.setProperty('--header-bg-4', t.header4);
    root.style.setProperty('--panel-glow', t.glow);

    // Save in cookie (expires in 1 year)
    document.cookie = `videxAccent=${colorName}; max-age=31536000; path=/`;
  }

  // Read cookie helper
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  // Initialize theme from cookie on load
  const savedColor = getCookie("videxAccent") || "blue";
  applyTheme(savedColor);

  // Set active button state in UI
  const colorBtns = document.querySelectorAll(".color-btn");
  colorBtns.forEach(btn => {
    if (btn.getAttribute("data-color") === savedColor) {
      btn.classList.add("selected");
    } else {
      btn.classList.remove("selected");
    }

    btn.addEventListener("click", () => {
      colorBtns.forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      const color = btn.getAttribute("data-color");
      applyTheme(color);
    });
  });
</script>

</body>
</html>
