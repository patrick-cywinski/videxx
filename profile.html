<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="Videx-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videxx - Profile</title>

  <style>
    /* Dynamic Accent Color CSS Variables (Defaults to Blue) */
    :root {
      --accent-deg-1: #74d9f7;
      --accent-deg-2: #38bde9;
      --accent-deg-3: #1597d0;
      --accent-deg-4: #0875ad;
      --accent-btn-1: #65d5ff;
      --accent-btn-2: #20afea;
      --accent-btn-3: #0786cb;
      --accent-btn-4: #079bdc;
      --accent-btn-border: #00699e;
      --logo-shadow-1: #b9efff;
      --logo-shadow-2: #168bd0;
      --header-bg-1: #daf4ff;
      --header-bg-2: #b2e5fc;
      --header-bg-3: #90d7f5;
      --header-bg-4: #b8ebfd;
      --panel-glow: rgba(37, 124, 161, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #17384a;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,0.95) 0 2%, transparent 3%),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.75) 0 2%, transparent 3%),
        linear-gradient(
          180deg,
          var(--accent-deg-1) 0%,
          var(--accent-deg-2) 25%,
          var(--accent-deg-3) 65%,
          var(--accent-deg-4) 100%
        );
      min-height: 100vh;
      padding: 0 15px 40px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% -10%,
          rgba(255,255,255,0.8),
          transparent 45%
        );
      opacity: 0.75;
    }

    .site-header {
      width: 100vw;
      position: relative;
      left: calc(-50vw + 50%);
      background:
        linear-gradient(
          180deg,
          var(--header-bg-1) 0%,
          var(--header-bg-2) 50%,
          var(--header-bg-3) 51%,
          var(--header-bg-4) 100%
        );
      border-bottom: 2px solid #ffffff;
      padding: 15px 20px 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(0, 50, 90, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .nav-buttons-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 700px;
    }

    .nav-btn {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      height: 33px;
      padding: 0 16px;
      border-radius: 6px;
      color: #17384a;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f2f9fc 45%,
          #d2eaf4 50%,
          #e5f4fb 100%
        );
      border: 1px solid #72aabd;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,70,100,0.15),
        0 2px 4px rgba(0,50,80,0.2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #ffffff 45%,
          #e3f3fb 50%,
          #f0f8fd 100%
        );
      border-color: #5193a8;
    }

    .nav-btn.active {
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          var(--accent-btn-1) 0%,
          var(--accent-btn-2) 45%,
          var(--accent-btn-3) 50%,
          var(--accent-btn-4) 100%
        );
      border-color: var(--accent-btn-border);
      text-shadow: 0 -1px 1px rgba(0,50,80,0.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,60,100,0.3),
        0 2px 4px rgba(0,50,80,0.25);
    }

    .videx-logo {
      text-align: center;
      margin: 0;
      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-size: 56px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 0.9;
      color: #ffffff;
      transform: skewX(-7deg);
      text-shadow:
        3px 3px 0 var(--logo-shadow-1),
        6px 6px 0 var(--logo-shadow-2),
        9px 9px 8px rgba(0, 63, 110, 0.35);
      user-select: none;
    }

    #mainApp {
      width: 100%;
      max-width: 700px;
      margin: auto;
      position: relative;
    }

    .main-panel {
      background:
        linear-gradient(
          180deg,
          #f8fdff 0%,
          #e9f8fd 7%,
          #c9e9f5 48%,
          #a8d8e9 100%
        );
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow:
        0 2px 0 rgba(0, 82, 126, 0.7),
        0 8px 18px rgba(0, 50, 90, 0.35),
        inset 0 1px 0 #ffffff,
        inset 0 -2px 5px var(--panel-glow);
    }

    .profile-container {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    /* Glossy Skeuomorphic Avatar Frame */
    .avatar-frame {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      padding: 4px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.9) 0%,
          rgba(200,233,245,0.8) 50%,
          rgba(114,170,189,0.9) 100%
        );
      border: 1px solid #ffffff;
      box-shadow:
        0 4px 8px rgba(0,50,80,0.25),
        inset 0 1px 2px rgba(255,255,255,0.9),
        inset 0 -1px 2px rgba(0,60,90,0.3);
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 5px;
      object-fit: cover;
      border: 1px solid #72aabd;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
      background: #ffffff;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .profile-username {
      color: #000000;
      font-size: 24px;
      font-weight: bold;
      word-break: break-word;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    .profile-joined {
      color: #527786;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 0 #ffffff;
    }

    .state-message {
      text-align: center;
      color: #527786;
      font-size: 14px;
      padding: 10px;
    }

    .error-message {
      color: #9b1717;
      background: #ffe7e7;
      border: 1px solid #c96b6b;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 0 10px 30px;
      }

      .videx-logo {
        font-size: 46px;
      }

      .profile-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="videx-logo">Videxx</div>
  <nav class="nav-buttons-container">
    <a href="home.html" class="nav-btn">Home</a>
    <a href="accounts-list.html" class="nav-btn active">Accounts</a>
    <a href="settings.html" class="nav-btn">Settings</a>
  </nav>
</header>

<div id="mainApp">
  <section class="main-panel">
    <div id="profileContent">
      <div class="state-message">Loading profile...</div>
    </div>
  </section>
</div>

<script>
  // Color themes definitions
  const themes = {
    red: {
      deg1: "#f7b5b5", deg2: "#e96e6e", deg3: "#d03232", deg4: "#ad0808",
      btn1: "#ff8080", btn2: "#f03b3b", btn3: "#cb0707", btn4: "#dc0707", btnBorder: "#9e0000",
      shadow1: "#ffbbbb", shadow2: "#d01616",
      header1: "#ffdfdf", header2: "#fcb2b2", header3: "#f59090", header4: "#fdb8b8",
      glow: "rgba(161, 37, 37, 0.25)"
    },
    orange: {
      deg1: "#f7d2b5", deg2: "#e99a6e", deg3: "#d06332", deg4: "#ad3c08",
      btn1: "#ffb065", btn2: "#ea7e20", btn3: "#cb5607", btn4: "#dc5c07", btnBorder: "#9e3900",
      shadow1: "#ffdec0", shadow2: "#d05516",
      header1: "#ffeedf", header2: "#fccbb2", header3: "#f5b090", header4: "#fdc7b8",
      glow: "rgba(161, 85, 37, 0.25)"
    },
    yellow: {
      deg1: "#f7f1b5", deg2: "#e9dc6e", deg3: "#d0bd32", deg4: "#ad9808",
      btn1: "#ffea65", btn2: "#eac420", btn3: "#cba507", btn4: "#dcb207", btnBorder: "#9e7e00",
      shadow1: "#fff9bb", shadow2: "#d0b016",
      header1: "#fffaef", header2: "#fcefb2", header3: "#f5e390", header4: "#fdeeb8",
      glow: "rgba(161, 138, 37, 0.25)"
    },
    green: {
      deg1: "#b5f7c2", deg2: "#6ee986", deg3: "#32d050", deg4: "#08ad27",
      btn1: "#65ff84", btn2: "#20ea46", btn3: "#07cb2e", btn4: "#07dc31", btnBorder: "#009e1e",
      shadow1: "#bbffc8", shadow2: "#16d039",
      header1: "#dffff3", header2: "#b2fcc1", header3: "#90f5a4", header4: "#b8fdbd",
      glow: "rgba(37, 161, 61, 0.25)"
    },
    blue: {
      deg1: "#74d9f7", deg2: "#38bde9", deg3: "#1597d0", deg4: "#0875ad",
      btn1: "#65d5ff", btn2: "#20afea", btn3: "#0786cb", btn4: "#079bdc", btnBorder: "#00699e",
      shadow1: "#b9efff", shadow2: "#168bd0",
      header1: "#daf4ff", header2: "#b2e5fc", header3: "#90d7f5", header4: "#b8ebfd",
      glow: "rgba(37, 124, 161, 0.25)"
    },
    purple: {
      deg1: "#d9b5f7", deg2: "#bd6ee9", deg3: "#9732d0", deg4: "#7508ad",
      btn1: "#d565ff", btn2: "#af20ea", btn3: "#8607cb", btn4: "#9b07dc", btnBorder: "#69009e",
      shadow1: "#efffb9", shadow2: "#8b16d0",
      header1: "#f4daff", header2: "#e5b2fc", header3: "#d590f5", header4: "#ebb8fd",
      glow: "rgba(124, 37, 161, 0.25)"
    },
    pink: {
      deg1: "#f7b5e0", deg2: "#e96ec0", deg3: "#d0329b", deg4: "#ad0876",
      btn1: "#ff65c9", btn2: "#ea209f", btn3: "#cb0784", btn4: "#dc0793", btnBorder: "#9e005d",
      shadow1: "#ffb9ec", shadow2: "#d0168b",
      header1: "#ffdff3", header2: "#fcb2e5", header3: "#f590d5", header4: "#fdb8eb",
      glow: "rgba(161, 37, 124, 0.25)"
    }
  };

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  const savedColor = getCookie("videxAccent") || "blue";
  const t = themes[savedColor] || themes["blue"];
  const root = document.documentElement;
  root.style.setProperty('--accent-deg-1', t.deg1);
  root.style.setProperty('--accent-deg-2', t.deg2);
  root.style.setProperty('--accent-deg-3', t.deg3);
  root.style.setProperty('--accent-deg-4', t.deg4);
  root.style.setProperty('--accent-btn-1', t.btn1);
  root.style.setProperty('--accent-btn-2', t.btn2);
  root.style.setProperty('--accent-btn-3', t.btn3);
  root.style.setProperty('--accent-btn-4', t.btn4);
  root.style.setProperty('--accent-btn-border', t.btnBorder);
  root.style.setProperty('--logo-shadow-1', t.shadow1);
  root.style.setProperty('--logo-shadow-2', t.shadow2);
  root.style.setProperty('--header-bg-1', t.header1);
  root.style.setProperty('--header-bg-2', t.header2);
  root.style.setProperty('--header-bg-3', t.header3);
  root.style.setProperty('--header-bg-4', t.header4);
  root.style.setProperty('--panel-glow', t.glow);
</script>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const accountsSupabaseUrl = "https://fphfzpfoigbtshambkxb.supabase.co";
  const accountsSupabaseKey = "sb_publishable_TWZESGuSDlQj0j6ukSCPxw_QjjYqMv6";

  const dbUsers = createClient(accountsSupabaseUrl, accountsSupabaseKey);
  const profileContentEl = document.getElementById("profileContent");

  async function loadProfile() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get("user");

    if (!targetUsername) {
      profileContentEl.innerHTML = '<div class="error-message">No username specified in URL.</div>';
      return;
    }

    try {
      const { data: user, error } = await dbUsers
        .from("users")
        .select("username, created_date")
        .eq("username", targetUsername)
        .maybeSingle();

      if (error) {
        throw new Error(error.message);
      }

      if (!user) {
        profileContentEl.innerHTML = '<div class="error-message">Account not found: ' + targetUsername + '</div>';
        return;
      }

      const joinedText = user.created_date ? "Joined on: " + user.created_date : "Joined date unavailable";

      profileContentEl.innerHTML = `
        <div class="profile-container">
          <div class="avatar-frame">
            <img src="user.png" alt="Profile Avatar" class="profile-avatar">
          </div>
          <div class="profile-info">
            <div class="profile-username">${user.username}</div>
            <div class="profile-joined">${joinedText}</div>
          </div>
        </div>
      `;

    } catch (err) {
      profileContentEl.innerHTML = '<div class="error-message">Failed to load profile: ' + err.message + '</div>';
    }
  }

  loadProfile();
</script>

</body>
</html>
