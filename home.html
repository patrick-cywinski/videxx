<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videxx - Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #17384a;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,0.95) 0 2%, transparent 3%),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.75) 0 2%, transparent 3%),
        linear-gradient(
          180deg,
          #74d9f7 0%,
          #38bde9 25%,
          #1597d0 65%,
          #0875ad 100%
        );
      min-height: 100vh;
      padding: 24px 15px 40px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% -10%,
          rgba(255,255,255,0.8),
          transparent 45%
        );
      opacity: 0.75;
    }

    #mainApp {
      width: 100%;
      max-width: 700px;
      margin: auto;
      position: relative;
    }

    .videx-logo {
      text-align: center;
      margin: 5px 0 18px;
      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-size: 64px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 0.9;
      color: #ffffff;
      transform: skewX(-7deg);
      text-shadow:
        3px 3px 0 #b9efff,
        6px 6px 0 #168bd0,
        9px 9px 8px rgba(0, 63, 110, 0.35);
      user-select: none;
    }

    .main-panel {
      background:
        linear-gradient(
          180deg,
          #f8fdff 0%,
          #e9f8fd 7%,
          #c9e9f5 48%,
          #a8d8e9 100%
        );
      border: 2px solid #ffffff;
      border-radius: 12px;
      box-shadow:
        0 2px 0 rgba(0, 82, 126, 0.7),
        0 8px 18px rgba(0, 50, 90, 0.35),
        inset 0 1px 0 #ffffff,
        inset 0 -2px 5px rgba(37, 124, 161, 0.25);
      overflow: hidden;
    }

    .user-section {
      padding: 16px;
    }

    .section-title {
      color: #075b8b;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 1px 0 #ffffff;
      margin-bottom: 10px;
    }

    .user-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #nameDisplay {
      flex: 1;
      min-width: 0;
      height: 39px;
      padding: 8px 11px;
      border: 1px solid #72aabd;
      border-radius: 5px;
      background: #ffffff;
      color: #164b65;
      font-size: 14px;
      font-weight: bold;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.425),
        0 1px 0 #ffffff;
    }

    .aero-divider {
      height: 2px;
      margin: 0 14px;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.95) 8%,
          #79bdd5 50%,
          rgba(255,255,255,0.95) 92%,
          transparent
        );
      box-shadow:
        0 1px 0 rgba(54, 126, 154, 0.3);
    }

    .post-section {
      padding: 16px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #72aabd;
      border-radius: 6px;
      background: #ffffff;
      color: #17384a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      box-shadow:
        inset 0 2px 5px rgba(0,70,100,0.17),
        0 1px 0 #ffffff;
    }

    textarea:focus {
      border-color: #159bd8;
      box-shadow:
        inset 0 2px 5px rgba(0,70,100,0.17),
        0 0 5px rgba(21,155,216,0.5);
    }

    textarea::placeholder {
      color: #7894a1;
    }

    .post-button-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
    }

    button {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .aero-button {
      height: 37px;
      padding: 0 17px;
      border-radius: 6px;
      color: #ffffff;
      border: 1px solid #176a91;
      text-shadow: 0 -1px 1px rgba(0,50,80,0.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 3px rgba(0,60,100,0.3),
        0 2px 4px rgba(0,50,80,0.25);
    }

    .aero-button:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(0,50,80,0.35),
        0 1px 2px rgba(0,50,80,0.25);
    }

    #postBtn {
      background:
        linear-gradient(
          180deg,
          #65d5ff 0%,
          #20afea 45%,
          #0786cb 50%,
          #079bdc 100%
        );
      border-color: #00699e;
    }

    #postBtn:hover {
      background:
        linear-gradient(
          180deg,
          #91e5ff 0%,
          #45c5f4 45%,
          #1096d6 50%,
          #25ade6 100%
        );
    }

    #refreshBtn {
      background:
        linear-gradient(
          180deg,
          #555555 0%,
          #252525 45%,
          #090909 50%,
          #292929 100%
        );
      border-color: #111111;
    }

    #refreshBtn:hover {
      background:
        linear-gradient(
          180deg,
          #707070 0%,
          #373737 45%,
          #111111 50%,
          #3c3c3c 100%
        );
    }

    #logoutBtn {
      flex-shrink: 0;
      background:
        linear-gradient(
          180deg,
          #80e5ff 0%,
          #23b5ec 45%,
          #078bd0 50%,
          #11a4df 100%
        );
      color: #06486a;
      text-shadow: 0 1px 0 #ffffff;
      border-color: #0878a9;
    }

    #logoutBtn:hover {
      background:
        linear-gradient(
          180deg,
          #a4efff 0%,
          #4ac8f3 45%,
          #1198da 50%,
          #31b4e8 100%
        );
    }

    #errorBox {
      display: none;
      margin: 12px 16px 0;
      padding: 9px 10px;
      border: 1px solid #c96b6b;
      border-radius: 5px;
      background: #ffe7e7;
      color: #9b1717;
      font-size: 13px;
      font-weight: bold;
    }

    .feed-area {
      margin-top: 18px;
    }

    .feed-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .feed-heading h2 {
      color: #ffffff;
      font-size: 22px;
      text-shadow:
        1px 1px 0 #075c88,
        2px 2px 3px rgba(0,50,80,0.35);
    }

    #feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post {
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f7fcfe 50%,
          #e1f1f6 100%
        );
      border: 1px solid #86b6c8;
      border-radius: 7px;
      padding: 13px;
      box-shadow:
        0 2px 4px rgba(0,60,90,0.22),
        inset 0 1px 0 #ffffff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #c1dce6;
    }

    .author {
      color: #075f91;
      font-size: 14px;
      font-weight: bold;
      word-break: break-word;
    }

    .timestamp {
      color: #718891;
      font-size: 11px;
      white-space: nowrap;
    }

    .post-content {
      margin-top: 9px;
      color: #244858;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .profile-link {
      color: #075f91;
      text-decoration: none;
    }

    .profile-link:hover {
      color: #008bd0;
      text-decoration: underline;
    }

    .loading-post {
      text-align: center;
      color: #527786;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 15px 10px 30px;
      }

      .videx-logo {
        font-size: 52px;
      }

      .user-row {
        flex-direction: column;
        align-items: stretch;
      }

      #logoutBtn {
        width: 100%;
      }

      .feed-heading {
        align-items: stretch;
        gap: 8px;
      }

      #refreshBtn {
        flex-shrink: 0;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }
    }
  </style>
</head>

<body>

<div id="mainApp">

  <div class="videx-logo">Videxx</div>

  <section class="main-panel">

    <div class="user-section">
      <div class="section-title">Logged in as</div>

      <div class="user-row">
        <input id="nameDisplay" readonly>

        <button id="logoutBtn" class="aero-button">
          Log Out
        </button>
      </div>
    </div>

    <div class="aero-divider"></div>

    <div class="post-section">
      <div class="section-title">Create a Post</div>

      <textarea
        id="postText"
        rows="4"
        maxlength="5000"
        placeholder="Write a post..."
      ></textarea>

      <div class="post-button-row">
        <button id="postBtn" class="aero-button">
          Post
        </button>
      </div>
    </div>

  </section>

  <div id="errorBox"></div>

  <section class="feed-area">

    <div class="feed-heading">
      <h2>Feed</h2>

      <button id="refreshBtn" class="aero-button">
        Refresh
      </button>
    </div>

    <div id="feed"></div>

  </section>

</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const postsSupabaseUrl = "https://btpeyadbqscxejitjopi.supabase.co";
  const postsSupabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0cGV5YWRicXNjeGVqaXRqb3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjIzOTQsImV4cCI6MjA3OTM5ODM5NH0.u2Sj-oObFRfPWbtn-Wvr2PbJmxcciucdHcgzyiSCCTg";

  const supabase = createClient(postsSupabaseUrl, postsSupabaseKey);

  const nameDisplay = document.getElementById("nameDisplay");
  const logoutBtn = document.getElementById("logoutBtn");
  const postText = document.getElementById("postText");
  const postBtn = document.getElementById("postBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const errorBox = document.getElementById("errorBox");
  const feedEl = document.getElementById("feed");

  let currentUserName = (
    localStorage.getItem("videxName") ||
    localStorage.getItem("videx_username") ||
    ""
  ).trim();

  if (!currentUserName) {
    window.location.href = "index.html";
  } else {
    nameDisplay.value = currentUserName;
  }

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("videxName");
    localStorage.removeItem("videx_username");
    window.location.href = "index.html";
  });

  postBtn.addEventListener("click", async () => {
    clearError();

    const text = (postText.value || "").trim();

    if (!text) {
      showError("Please write something.");
      return;
    }

    postBtn.disabled = true;
    postBtn.textContent = "Posting...";

    const { error } = await supabase
      .from("posts")
      .insert([
        {
          username: currentUserName,
          text: text
        }
      ]);

    postBtn.disabled = false;
    postBtn.textContent = "Post";

    if (error) {
      showError("Post error: " + error.message);
      return;
    }

    postText.value = "";
    await loadPosts();
  });

  refreshBtn.addEventListener("click", loadPosts);

  async function loadPosts() {
    clearError();
    feedEl.innerHTML = '<div class="post loading-post">Loading...</div>';

    const { data, error } = await supabase
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      showError("Load error: " + error.message);
      feedEl.innerHTML = "";
      return;
    }

    feedEl.innerHTML = "";

    if (!data || data.length === 0) {
      feedEl.innerHTML = '<div class="post loading-post">No posts yet. Be the first to post.</div>';
      return;
    }

    data.forEach(post => {
      const div = document.createElement("div");
      div.className = "post";

      const header = document.createElement("div");
      header.className = "header";

      const author = document.createElement("strong");
      author.className = "author";

      const profileLink = document.createElement("a");
      profileLink.className = "profile-link";
      profileLink.href = "profile.html?user=" + encodeURIComponent(post.username || "");
      profileLink.textContent = post.username || "Anonymous";

      author.appendChild(profileLink);

      const timestamp = document.createElement("span");
      timestamp.className = "timestamp";
      const time = post.created_at ? new Date(post.created_at).toLocaleString() : "";
      timestamp.textContent = time;

      header.appendChild(author);
      header.appendChild(timestamp);

      const content = document.createElement("div");
      content.className = "post-content";

      let cleanText = String(post.text || "").replace(/^RATING_V1:\d+:/, "");
      content.textContent = cleanText;

      div.appendChild(header);
      div.appendChild(content);
      feedEl.appendChild(div);
    });
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  loadPosts();
</script>

</body>
</html>
